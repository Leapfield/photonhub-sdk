name: release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bind release tag to protected public main and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          python -c 'import pathlib,re; raw=pathlib.Path("PHOTONHUB_SOURCE_COMMIT").read_text(); assert re.fullmatch(r"[0-9a-f]{40}\n?", raw)'
          python .github/scripts/package_version.py --tag "$RELEASE_TAG"
      - run: python -m pip install ".[test,app]" build twine
      - run: pytest -q
      - run: python -m simupod.schema check
      - run: python -m build
      - name: Validate and record release artifacts
        run: |
          python -m twine check dist/*
          python .github/scripts/verify_artifacts.py dist
          {
            echo '### simupod release artifact SHA-256'
            echo '```text'
            sha256sum dist/*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: python .github/scripts/smoke_artifacts.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  wheel-smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Install and smoke the exact wheel
        run: |
          python -m pip install dist/simupod-*-py3-none-any.whl
          python -m pip check
          python .github/scripts/smoke_install.py
          set +e
          output="$(python -c 'from simupod.cli import mcp; raise SystemExit(mcp())' 2>&1)"
          result=$?
          set -e
          test "$result" -eq 2
          grep -F 'simupod[app]' <<<"$output"

  publish:
    needs: [build, wheel-smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/simupod/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
