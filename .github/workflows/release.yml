name: release

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require release tag to match package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/package_version.py --tag "$RELEASE_TAG"
      - run: python -m pip install ".[test]" build twine
      - run: pytest -q
      - run: python -m simupod.schema check
      - run: python -m build
      - run: |
          python -m twine check dist/*
          python .github/scripts/verify_artifacts.py dist
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/simupod/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
