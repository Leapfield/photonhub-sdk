name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: sdk-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installed-smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install .
      - run: |
          python -m pip check
          python .github/scripts/smoke_install.py

  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[test]" build twine
      - run: pytest -q
      - run: python -m simupod.schema check
      - run: python -m build
      - run: |
          python -m twine check dist/*
          python .github/scripts/verify_artifacts.py dist
